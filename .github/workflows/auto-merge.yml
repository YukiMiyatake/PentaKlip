name: Auto merge

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, ready_for_review]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  enable-auto-merge:
    name: Enable auto-merge when labeled
    if: >
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      contains(github.event.pull_request.labels.*.name, 'auto-merge')
    runs-on: ubuntu-latest
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --auto \
            --squash

  merge-when-green:
    name: Merge labeled PR when CI is green
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Find PR and merge if labeled auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh api \
            "repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls" \
            --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR found for commit"
            exit 0
          fi
          LABELS=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels --jq '[.labels[].name] | join(",")')
          echo "PR #$PR_NUMBER labels: $LABELS"
          if [[ "$LABELS" != *"auto-merge"* ]]; then
            echo "Label auto-merge not present; skip"
            exit 0
          fi
          DRAFT=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft')
          if [ "$DRAFT" = "true" ]; then
            echo "Draft PR; skip"
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --squash --auto || \
            gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --squash
