name: Auto merge

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, ready_for_review]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    # Sweep PRs that stayed open after --auto queued, went BEHIND, or
    # hit action_required after github-actions update-branch.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write

jobs:
  enable-auto-merge:
    name: Enable auto-merge when type-labeled
    if: >
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      (
        contains(github.event.pull_request.labels.*.name, 'feature') ||
        contains(github.event.pull_request.labels.*.name, 'fix') ||
        contains(github.event.pull_request.labels.*.name, 'chore') ||
        contains(github.event.pull_request.labels.*.name, 'docs') ||
        contains(github.event.pull_request.labels.*.name, 'ci')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Queue squash auto-merge (backup while CI runs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # --auto only queues; real merge happens in merge-when-green.
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --auto \
            --squash || true

  merge-when-green:
    name: Merge type-labeled PR when CI is green
    if: >
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request'
      ) || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR numbers
        id: prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUMBERS=""
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
            NUMBERS=$(gh api \
              "repos/${{ github.repository }}/commits/${SHA}/pulls" \
              -H "Accept: application/vnd.github+json" \
              --jq '[.[].number] | unique | .[]' || true)
          else
            NUMBERS=$(gh pr list --repo "${{ github.repository }}" --state open \
              --json number,labels,isDraft \
              --jq '.[] | select(.isDraft==false) | select(any(.labels[].name; .=="feature" or .=="fix" or .=="chore" or .=="docs" or .=="ci")) | .number')
          fi
          {
            echo "numbers<<EOF"
            echo "$NUMBERS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Candidate PRs:"
          echo "$NUMBERS"

      - name: Update behind branches and squash-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBERS: ${{ steps.prs.outputs.numbers }}
        run: |
          set -euo pipefail
          TYPE_LABELS="feature fix chore docs ci"

          # github-actions update-branch commits often leave new workflow runs in
          # action_required (no jobs). Approve + rerun so CI can report again.
          unstick_action_required() {
            local pr_number="$1"
            local branch
            branch=$(gh pr view "$pr_number" --repo "${{ github.repository }}" \
              --json headRefName -q .headRefName)
            local sha
            sha=$(gh pr view "$pr_number" --repo "${{ github.repository }}" \
              --json headRefOid -q .headRefOid)
            echo "Unstick action_required runs on ${branch} @ ${sha}"
            local ids
            ids=$(gh run list --repo "${{ github.repository }}" --branch "$branch" \
              --limit 30 --json databaseId,conclusion,headSha,status \
              --jq --arg sha "$sha" \
              '[.[] | select(.headSha==$sha) | select(.conclusion=="action_required" or (.status=="waiting" and .conclusion=="")) | .databaseId] | unique | .[]' \
              || true)
            if [ -z "${ids}" ]; then
              echo "No action_required runs found"
              return 0
            fi
            printf '%s\n' "$ids" | while IFS= read -r run_id || [ -n "$run_id" ]; do
              run_id=$(echo "$run_id" | tr -d '[:space:]')
              [ -z "$run_id" ] && continue
              echo "Approve/rerun run ${run_id}"
              gh api -X POST \
                "repos/${{ github.repository }}/actions/runs/${run_id}/approve" \
                >/dev/null 2>&1 || true
              gh run rerun "$run_id" --repo "${{ github.repository }}" || true
            done
          }

          printf '%s\n' "$PR_NUMBERS" | while IFS= read -r PR_NUMBER || [ -n "$PR_NUMBER" ]; do
            PR_NUMBER=$(echo "$PR_NUMBER" | tr -d '[:space:]')
            [ -z "$PR_NUMBER" ] && continue
            echo "==== PR #${PR_NUMBER} ===="
            META=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" \
              --json labels,isDraft,state,mergeStateStatus,mergeable,statusCheckRollup)
            STATE=$(echo "$META" | jq -r '.state')
            DRAFT=$(echo "$META" | jq -r '.isDraft')
            MERGE_STATE=$(echo "$META" | jq -r '.mergeStateStatus')
            LABELS=$(echo "$META" | jq -r '[.labels[].name] | join(",")')
            echo "state=${STATE} draft=${DRAFT} mergeState=${MERGE_STATE} labels=${LABELS}"

            if [ "$STATE" != "OPEN" ] || [ "$DRAFT" = "true" ]; then
              echo "Skip (not open / draft)"
              continue
            fi

            HAS_TYPE=false
            for required in $TYPE_LABELS; do
              if [[ ",${LABELS}," == *",${required},"* ]]; then
                HAS_TYPE=true
                break
              fi
            done
            if [ "$HAS_TYPE" != "true" ]; then
              echo "Skip (no type label)"
              continue
            fi

            # Required check: CI summary must be success when present.
            CI_SUMMARY=$(echo "$META" | jq -r '
              [.statusCheckRollup[]?
                | select(.name=="CI summary")
                | .conclusion] | first // empty')
            CHECK_COUNT=$(echo "$META" | jq -r '[.statusCheckRollup[]?] | length')

            # No checks / stuck after bot update-branch → approve+rerun and wait.
            if [ "$CHECK_COUNT" = "0" ] || [ -z "$CI_SUMMARY" ]; then
              echo "Missing CI checks (count=${CHECK_COUNT} summary='${CI_SUMMARY}')"
              unstick_action_required "$PR_NUMBER"
              echo "Skip until CI reports"
              continue
            fi

            if [ -n "$CI_SUMMARY" ] && [ "$CI_SUMMARY" != "SUCCESS" ]; then
              echo "Skip (CI summary=${CI_SUMMARY})"
              continue
            fi

            if [ "$MERGE_STATE" = "BEHIND" ] || [ "$MERGE_STATE" = "DIRTY" ]; then
              echo "Updating branch from base..."
              if gh pr update-branch "$PR_NUMBER" --repo "${{ github.repository }}"; then
                echo "Branch updated; unstick any action_required follow-up runs"
                # New bot commit often needs approval before CI jobs appear.
                sleep 8
                unstick_action_required "$PR_NUMBER"
                echo "Next green CI will merge"
              else
                echo "update-branch failed (may need manual conflict resolution)"
              fi
              continue
            fi

            # Immediate squash. Do NOT treat --auto success as done:
            # --auto only queues and leaves BEHIND / private-repo PRs stuck.
            if gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --squash; then
              echo "Merged #${PR_NUMBER}"
              continue
            fi

            echo "Direct merge failed; queue --auto as fallback"
            gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --squash --auto || true
          done
